[project]
name = "symulacja-sieci-autobusowej-krakowa"
version = "0.1.0"
description = "Symulacja propagacji opoznien w sieci autobusowej Krakowa (DES, GTFS-Realtime)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastparquet>=2026.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["sandbox/gtfs-experiments"]
testpaths = ["tests"]
